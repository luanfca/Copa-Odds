name: Coleta diária completa

on:
  schedule:
    # 06:00 em Fortaleza (UTC-3)
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: copa-odds-daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
      AUTO_SCRAPE_ENABLED: "false"
      PREWARM_ON_START: "false"
      SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar aplicação
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Sincronizar banco
        run: |
          for attempt in {1..5}; do
            if npx prisma db push --skip-generate; then
              exit 0
            fi
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Executar lote diário completo
        run: npm run scrape
