name: Coleta diária completa

on:
  schedule:
    # 06:00 em Fortaleza (UTC-3)
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: copa-odds-daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
    steps:
      - name: Acordar serviço no Render
        run: |
          curl --fail --show-error --silent \
            --max-time 300 \
            --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            https://copa-odds.onrender.com/api/admin/health

      - name: Executar lote diário completo no Render
        run: |
          curl --fail --show-error \
            --max-time 5400 \
            --request POST \
            --header "x-scrape-key: ${SCRAPE_SECRET}" \
            --header "Origin: https://copa-odds.onrender.com" \
            https://copa-odds.onrender.com/api/scrape
