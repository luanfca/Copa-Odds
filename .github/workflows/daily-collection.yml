name: Coleta diária completa

on:
  schedule:
    # 06:00 em Fortaleza (UTC-3)
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: copa-odds-daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
      AUTO_SCRAPE_ENABLED: "false"
      PREWARM_ON_START: "false"
      SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar aplicação
        run: npm ci

      - name: Iniciar gateway SofaScore
        run: |
          node scripts/sofascore-playwright-server.mjs > /tmp/sofascore.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 40 http://127.0.0.1:54545/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sofascore.log
          exit 1

      - name: Sincronizar banco
        run: |
          for attempt in {1..5}; do
            if npx prisma db push --skip-generate; then
              exit 0
            fi
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Executar lote diário completo
        run: npm run scrape

      - name: Mostrar log SofaScore em caso de falha
        if: failure()
        run: tail -n 300 /tmp/sofascore.log || true
