services:
  - type: web
    name: copa-odds
    runtime: docker
    plan: free
    healthCheckPath: /api/admin/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MOCK
        value: "false"
      - key: AUTO_SCRAPE_ENABLED
        value: "false"
      - key: PREWARM_ON_START
        value: "false"
      - key: SCRAPE_PROFILE
        value: "low-memory"
      - key: SOFA_SERVER_URL
        value: "http://127.0.0.1:54545"
